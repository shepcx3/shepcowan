<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shep Cowan — Film</title>
  <meta name="description" content="Shep Cowan — Second Assistant Director on commercials and music videos in Toronto.">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <!-- Bump ?v= whenever styles.css or the scripts change so browsers don't use a stale copy -->
  <link rel="stylesheet" href="styles.css?v=7">
  <!-- Intro plays once per visit; needs JS -->
  <script>
    try { if (!sessionStorage.getItem("introSeen")) document.documentElement.classList.add("intro-on"); }
    catch (e) { document.documentElement.classList.add("intro-on"); }
  </script>
</head>
<body class="film">

  <div class="intro" id="intro" aria-hidden="true">
    <span class="wordmark intro-mark">Shep Cowan</span>
  </div>

  <header class="top">
    <a class="wordmark" href="./">Shep Cowan</a>
    <p class="role"><span class="long">2nd Assistant Director</span><span class="short">2nd AD</span> &middot; Toronto</p>
  </header>

  <!-- Fixed index of projects; the active one is bright, the rest fade back -->
  <nav class="index" aria-label="Projects">
    <ol id="index-list"></ol>
  </nav>

  <main id="reel" class="reel"></main>

  <footer class="bottom">
    <span class="counter" id="counter" aria-live="polite">1/1</span>
  </footer>

  <script src="film.js?v=7"></script>
  <script src="intro.js?v=7"></script>
</body>
</html>
